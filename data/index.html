<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5">
  <title>ESP32 Weather Station</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    h1 {
      color: #00adb5;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .card {
      background: #2d2d2d;
      margin: 12px 0;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label {
      color: #aaaaaa;
    }
    .val {
      font-weight: bold;
      color: #eeeeee;
    }
    .temp {
      color: #ff5722;
    }
    .hum {
      color: #00bcd4;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 Weather Station</h1>
    <div class="card" style="display: {{ERROR_DISPLAY}}">
      <span class="label">Status:</span>
      <span class="val" style="color: #ff5252;">DHT11 Sensor Error</span>
    </div>
    <div style="display: {{DATA_DISPLAY}}">
      <div class="card">
        <span class="label">Temperature:</span>
        <span class="val temp">{{TEMPERATURE}} &deg;C</span>
      </div>
      <div class="card">
        <span class="label">Humidity:</span>
        <span class="val hum">{{HUMIDITY}} %</span>
      </div>
      <div class="card">
        <span class="label">Min Temperature:</span>
        <span class="val">{{MIN_TEMPERATURE}} &deg;C</span>
      </div>
      <div class="card">
        <span class="label">Max Temperature:</span>
        <span class="val">{{MAX_TEMPERATURE}} &deg;C</span>
      </div>
    </div>
    <div class="footer">Auto-refreshes every 5 seconds</div>
  </div>
</body>
</html>
