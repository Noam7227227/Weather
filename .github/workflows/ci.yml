name: PlatformIO CI/CD Checks

on:
  push:
    branches: [ "main", "master", "Features" ]
  pull_request:
    branches: [ "main", "master", "Features" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Firmware (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Pip & PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare .env File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "WIFI_SSID=dummy_ssid" > .env
            echo "WIFI_PASSWORD=dummy_password" >> .env
          fi

      - name: Build Firmware
        run: pio run

  lint-python:
    name: Lint Python Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 on read_env.py
        run: |
          flake8 read_env.py --max-line-length=120 --ignore=E501,F821

  gitleaks:
    name: Secret Leak Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
